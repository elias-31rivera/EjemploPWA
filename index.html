<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16213d">
  <title>Control de Inventario</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <header>
    <h1>📦 Control de Inventario</h1>
    <span id="sync-status">Conectando...</span>
  </header>
  <div class="container">
    <div class="stats">
      <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">Productos</div></div>
      <div class="stat"><div class="num" id="stat-valor">$0</div><div class="lbl">Valor total</div></div>
      <div class="stat"><div class="num" id="stat-bajos">0</div><div class="lbl">Stock bajo</div></div>
    </div>
    <div class="card">
      <h2>➕ Nuevo producto</h2>
      <form id="form-producto">
        <input id="nombre" placeholder="Nombre" required>
        <input id="categoria" placeholder="Categoría">
        <input id="cantidad" type="number" min="0" placeholder="Cantidad" required>
        <input id="precio" type="number" step="0.01" min="0" placeholder="Precio">
        <input id="minimo" type="number" min="0" placeholder="Stock mínimo">
        <button type="submit" class="btn-primary">Guardar</button>
      </form>
    </div>
    <div class="card">
      <h2>📋 Inventario</h2>
      <div class="search-bar"><input id="buscar" placeholder="🔍 Buscar por nombre o categoría..."></div>
      <table>
        <thead><tr><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr></thead>
        <tbody id="tabla-body"></tbody>
      </table>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
